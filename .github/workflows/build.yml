name: Build PintaYa.exe
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name PintaYa --collect-all pillow_heif --collect-submodules pymupdf app.py
      - uses: actions/upload-artifact@v4
        with: { name: PintaYa-windows, path: dist/PintaYa.exe }
